name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        cxx: [g++, clang++]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fish clang
      - run: make CXX=${{ matrix.cxx }}
      - run: make test
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fish
      - run: >-
          make CXX=g++
          CXXFLAGS='-O1 -g -std=c++17 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer'
          LDFLAGS='-fsanitize=address,undefined'
      - run: >-
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          make test
          CXXFLAGS='-O1 -g -std=c++17 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer'
          LDFLAGS='-fsanitize=address,undefined'
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sanitize]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fish
      - run: make static
      - run: HED=$PWD/hed bash tests/run.sh && HED=$PWD/hed python3 tests/editor_pty.py
      - run: mv hed hed-linux-${{ matrix.arch }}
      - uses: softprops/action-gh-release@v2
        with:
          files: hed-linux-${{ matrix.arch }}
